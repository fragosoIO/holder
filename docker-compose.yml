services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: holder
      POSTGRES_PASSWORD: holder
      POSTGRES_DB: holder
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holder -d holder"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - holder_pg:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

  api:
    build: ./docker/php
    user: "1000:1000"
    working_dir: /repo/api
    volumes:
      - .:/repo
      # Host Pi login, mounted on the container user's home. Not /root/.pi:
      # a root process rewrites accounts.json as mode 0600 and the host user
      # then gets EACCES from `pi`.
      - ${HOME}/.pi:/home/holder/.pi
    env_file:
      - ./api/.env
    environment:
      HOME: /home/holder
      HOLDER_DB_HOST: postgres
      HOLDER_API_URL: http://api:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/repo/docker/php/entrypoint.sh"]
    command: ["php", "./yii", "serve", "0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  # Pi's model servers are host loopback addresses (SSH tunnels, local models).
  # The bridge network cannot reach those, and Docker drops traffic to the bridge IP.
  # This service shares the host network so localhost in ~/.pi is the machine's localhost.
  # A profile keeps `docker compose up` from racing the test suite's own worker.
  worker:
    profiles: ["worker"]
    build: ./docker/php
    network_mode: host
    user: "1000:1000"
    working_dir: /repo/api
    volumes:
      - .:/repo
      - ${HOME}/.pi:/home/holder/.pi
    env_file:
      - ./api/.env
    environment:
      HOME: /home/holder
      HOLDER_DB_HOST: 127.0.0.1
      HOLDER_API_URL: http://127.0.0.1:8080
    entrypoint: ["php"]
    command: ["./yii", "heartbeat:work"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    image: node:22-bookworm-slim
    user: "1000:1000"
    working_dir: /repo/ui
    volumes:
      - .:/repo
    environment:
      HOME: /tmp
      HOLDER_API_PROXY: http://api:8080
      HOLDER_BEHIND_PROXY: "1"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.holder.rule=HostRegexp(`^holder\\.(localhost|test|zixio\\.de)$`) || HostRegexp(`^holder[\\.]?.*\\.traefik\\.me$`)"
      - "traefik.http.routers.holder.entrypoints=websecure"
      - "traefik.http.routers.holder.tls.certresolver=le"
      - "traefik.http.routers.holder.tls=true"
      - "traefik.http.routers.holder.service=holder"
      - "traefik.http.services.holder.loadbalancer.server.port=5173"
    networks:
      - proxy
      - internal
    restart: unless-stopped

networks:
  proxy:
    external: true
  internal:

volumes:
  holder_pg:
